<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fbf4e9">
  <meta name="robots" content="noindex">
  <title>Dance with JSPR · Private dance lessons</title>
  <meta name="description" content="Private one-on-one FaceTime dance lessons with @jspr_dances. Request a 30- or 60-minute lesson.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="#top" aria-label="Dance with JSPR, @jspr_dances, top of page">
        <span class="wordmark-text">
          <span data-brand="siteName">Dance with JSPR</span>
          <span class="wordmark-handle" data-brand="handle">@jspr_dances</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="#lessons">Lessons</a>
        <a href="#how-it-works">How it works</a>
      </nav>
      <button type="button" class="preview-pill" id="preview-pill" aria-haspopup="dialog" aria-controls="preview-dialog" hidden>
        <span class="preview-dot" aria-hidden="true"></span>Preview only
      </button>
    </div>
  </header>

  <main id="main" class="site-main" tabindex="-1">
    <noscript>
      <div class="wrap noscript">This page needs JavaScript turned on to run.</div>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p><span data-brand="siteName">Dance with JSPR</span> · <span data-brand="handle">@jspr_dances</span></p>
    </div>
  </footer>

  <dialog id="preview-dialog" class="about-dialog" aria-labelledby="preview-title">
    <div class="dialog-body">
      <p class="eyebrow" id="preview-choice" hidden></p>
      <h2 id="preview-title">Preview only</h2>
      <ul id="preview-points" class="about-points"></ul>
      <button type="button" class="button button-primary" id="preview-close">Got it</button>
    </div>
  </dialog>
</body>
</html>
